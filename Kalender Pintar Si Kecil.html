<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kalender Pintar Si Kecil</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFF3D6;--card:#FFFFFF;--ink:#2A2540;--mut:#6B6685;--line:#EADFC0;--sun:#E5484D;--r:#E5484D;--o:#E8890C;--g:#0E9F8E;--b:#3D6FE0;--p:#8B5CF6;--mc:#E0661F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1C1833;--card:#2A2548;--ink:#F6F2FF;--mut:#B9B2DA;--line:#3E3868;--sun:#FF7B80;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1C1833;--card:#2A2548;--ink:#F6F2FF;--mut:#B9B2DA;--line:#3E3868;--sun:#FF7B80;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.35;min-height:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:1px 11px;border-radius:99px;color:#fff;white-space:nowrap}
.cr{background:var(--r)}.co{background:var(--o)}.cg{background:var(--g)}.cb{background:var(--b)}.cp{background:var(--p)}
/* tear-off leaf */
.leaf{position:relative;background:var(--card);border-radius:22px;margin:22px auto 0;max-width:430px;box-shadow:0 10px 0 -4px var(--line),0 18px 30px -12px rgba(40,20,80,.35);overflow:visible}
.rings{position:absolute;top:-16px;left:0;right:0;display:flex;justify-content:space-evenly;padding:0 26px;z-index:2}
.rings i{width:14px;height:32px;border-radius:8px;background:var(--ink);opacity:.85;border:3px solid var(--paper)}
.band{background:var(--mc);color:#fff;border-radius:22px 22px 0 0;padding:26px 20px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.band b{display:block;font-size:34px;font-weight:800;line-height:1}
.band .chip{background:rgba(255,255,255,.26);margin-top:6px}
.lbody{display:flex;align-items:center;justify-content:space-around;gap:8px;padding:12px 16px 8px;text-align:center}
.lbody b{display:block;font-weight:800;line-height:.95}
#lTgl{font-size:clamp(88px,26vw,128px);color:var(--mc)}
#lHari{font-size:clamp(34px,10vw,46px);color:var(--ink)}
.say{display:block;margin:4px auto 16px;border:0;border-radius:99px;background:var(--b);color:#fff;font-weight:700;padding:7px 20px}
.say:active{transform:scale(.96)}
/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0 14px}
.tabs button{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:8px;font-weight:800;font-size:19px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card{background:var(--card);border-radius:20px;padding:14px;border:3px solid var(--line)}
.nav{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}
.nav button,.yr button{border:0;background:var(--mc);color:#fff;border-radius:14px;height:46px;font-size:24px;font-weight:800}
.nav select{height:46px;border-radius:14px;border:3px solid var(--mc);background:var(--card);color:var(--ink);font:800 22px "Baloo 2",system-ui,sans-serif;text-align:center;text-align-last:center}
.yr{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center;margin:8px 0 12px}
.yr button{background:var(--p);height:38px;font-size:22px}
.yr div{text-align:center;font-weight:800;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.h{text-align:center;font-weight:800;font-size:14px;color:#fff;border-radius:10px;padding:3px 0}
.d{aspect-ratio:1;border:2px solid var(--line);border-radius:13px;background:var(--card);color:var(--ink);font-weight:800;font-size:clamp(16px,5vw,24px);padding:0}
.d.we{color:var(--sun)}
.d.td{background:var(--o);border-color:var(--o);color:#fff}
.d.sl{outline:4px solid var(--b);outline-offset:1px}
.d:active{transform:scale(.92)}
.d.e{visibility:hidden}
.info{margin-top:12px;border-radius:18px;padding:12px 14px;background:var(--card);border:3px dashed var(--mc)}
.info p{margin:2px 0}
.info .t{font-size:21px;font-weight:800}
.mut{color:var(--mut);font-size:15px}
/* quiz */
.score{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.q{font-size:24px;font-weight:800;line-height:1.2;margin:12px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:12px 6px;font-weight:800;font-size:20px}
.opts button.ok{background:var(--g);border-color:var(--g);color:#fff;animation:pop .35s}
.opts button.no{background:var(--r);border-color:var(--r);color:#fff}
.fb{min-height:30px;font-weight:800;font-size:20px;margin:12px 0 6px}
.next{border:0;border-radius:99px;background:var(--p);color:#fff;font-weight:800;padding:9px 24px;font-size:18px}
@keyframes pop{50%{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <section class="leaf" aria-label="Hari ini">
    <div class="rings" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="band" id="band">
      <div><b id="lBulan">Oktober</b><span class="chip" id="lBn">Bulan ke-10</span></div>
      <div style="text-align:right"><b id="lTahun">2026</b><span class="chip">Tahun</span></div>
    </div>
    <div class="lbody">
      <div><b id="lTgl">25</b><span class="chip co">Tanggal</span></div>
      <div><b id="lHari">Minggu</b><span class="chip cr">Hari</span></div>
    </div>
    <button class="say" id="say">🔊 Bacakan</button>
  </section>

  <nav class="tabs" aria-label="Pilih menu">
    <button id="tK" aria-pressed="true">📅 Kalender</button>
    <button id="tQ" aria-pressed="false">⭐ Tantangan</button>
  </nav>

  <section id="pK">
    <div class="card">
      <div class="nav">
        <button id="pm" aria-label="Bulan sebelumnya">‹</button>
        <select id="mSel" aria-label="Pilih bulan"></select>
        <button id="nm" aria-label="Bulan berikutnya">›</button>
      </div>
      <div class="yr">
        <button id="py" aria-label="Tahun sebelumnya">−</button>
        <div>Tahun <span id="yVal">2026</span></div>
        <button id="ny" aria-label="Tahun berikutnya">+</button>
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="info" id="info" aria-live="polite"></div>
    <p class="mut" style="text-align:center">Ketuk satu tanggal untuk tahu harinya dan menghitung berapa hari lagi.</p>
  </section>

  <section id="pQ" hidden>
    <div class="card">
      <div class="score"><span>Benar: <span id="sc">0</span> dari <span id="tt">0</span></span><span id="stars" aria-label="Bintang"></span></div>
      <div class="q" id="qt"></div>
      <div class="opts" id="qo"></div>
      <div class="fb" id="fb" aria-live="polite"></div>
      <button class="next" id="nx" hidden>Soal berikutnya</button>
    </div>
    <p class="mut" style="text-align:center">Soal tanggal memakai bulan yang sedang dibuka di kalender.</p>
  </section>
</main>

<script>
const M=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const D=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const DS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const HC=['#E5484D','#E8890C','#C99A00','#3E9B4F','#0E9F8E','#3D6FE0','#8B5CF6'];
const MC=['#3D6FE0','#8B5CF6','#0E9F8E','#E8890C','#E5484D','#D6407A','#0891B2','#3E9B4F','#C77D0A','#E0661F','#7C5CE0','#C93A4A'];
const $=id=>document.getElementById(id);
const now=new Date();
const T={y:now.getFullYear(),m:now.getMonth(),d:now.getDate()};
let vy=T.y,vm=T.m,sel={y:T.y,m:T.m,d:T.d};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const dow=(y,m,d)=>new Date(y,m,d).getDay();
const leap=y=>(y%4==0&&y%100!=0)||y%400==0;
const diff=(a,b)=>Math.round((Date.UTC(a.y,a.m,a.d)-Date.UTC(b.y,b.m,b.d))/864e5);
const doy=a=>diff(a,{y:a.y,m:0,d:1})+1;
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};

function fillToday(){
  const w=dow(T.y,T.m,T.d);
  $('lBulan').textContent=M[T.m];$('lBn').textContent='Bulan ke-'+(T.m+1);
  $('lTahun').textContent=T.y;$('lTgl').textContent=T.d;$('lHari').textContent=D[w];
  $('band').style.setProperty('background',MC[T.m]);
  document.documentElement.style.setProperty('--mc',MC[T.m]);
}
$('say').onclick=()=>say('Hari ini hari '+D[dow(T.y,T.m,T.d)]+', tanggal '+T.d+' '+M[T.m]+' '+T.y);

$('mSel').innerHTML=M.map((n,i)=>'<option value="'+i+'">'+n+'</option>').join('');
function render(){
  $('mSel').value=vm;$('yVal').textContent=vy;
  const mc=MC[vm];
  ['pm','nm','mSel'].forEach(id=>{const e=$(id);if(id=='mSel')e.style.borderColor=mc;else e.style.background=mc});
  let h=DS.map((n,i)=>'<div class="h" style="background:'+HC[i]+'">'+n+'</div>').join('');
  const f=dow(vy,vm,1),n=dim(vy,vm);
  for(let i=0;i<f;i++)h+='<button class="d e" tabindex="-1" aria-hidden="true"></button>';
  for(let d=1;d<=n;d++){
    const w=(f+d-1)%7;
    let c='d'+(w==0||w==6?' we':'');
    if(vy==T.y&&vm==T.m&&d==T.d)c+=' td';
    if(vy==sel.y&&vm==sel.m&&d==sel.d)c+=' sl';
    h+='<button class="'+c+'" data-d="'+d+'" aria-label="'+d+' '+M[vm]+' '+vy+'">'+d+'</button>';
  }
  $('grid').innerHTML=h;
  showInfo();
}
function showInfo(){
  const f=dow(vy,vm,1),n=dim(vy,vm);
  let s='';
  if(sel.y==vy&&sel.m==vm){
    const dd=diff(sel,T);
    const rel=dd==0?'Itu hari ini!':dd>0?'<b>'+dd+'</b> hari lagi dari hari ini.':'<b>'+(-dd)+'</b> hari yang lalu.';
    s+='<p class="t">'+D[dow(sel.y,sel.m,sel.d)]+', '+sel.d+' '+M[sel.m]+' '+sel.y+'</p><p>'+rel+'</p><p class="mut">Tanggal ini adalah hari ke-'+doy(sel)+' dalam tahun '+sel.y+'.</p><hr style="border:0;border-top:2px dotted var(--line);margin:8px 0">';
  }
  s+='<p><b>'+M[vm]+'</b> adalah bulan ke-'+(vm+1)+' dari 12 bulan.</p><p>Ada <b>'+n+' hari</b> di bulan ini. Tanggal 1 jatuh pada hari <b>'+D[f]+'</b>.</p>';
  if(vm==1)s+='<p class="mut">'+(leap(vy)?'Tahun '+vy+' adalah tahun kabisat, jadi Februari punya 29 hari.':'Tahun '+vy+' bukan tahun kabisat, jadi Februari punya 28 hari. Tahun kabisat datang 4 tahun sekali.')+'</p>';
  $('info').innerHTML=s;
  $('info').style.borderColor=MC[vm];
}
$('grid').onclick=e=>{const b=e.target.closest('.d[data-d]');if(!b)return;sel={y:vy,m:vm,d:+b.dataset.d};render();
  say(D[dow(sel.y,sel.m,sel.d)]+', '+sel.d+' '+M[sel.m]+' '+sel.y)};
const go=(dm,dy)=>{vm+=dm;vy+=dy;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}vy=Math.min(2100,Math.max(1900,vy));render()};
$('pm').onclick=()=>go(-1,0);$('nm').onclick=()=>go(1,0);$('py').onclick=()=>go(0,-1);$('ny').onclick=()=>go(0,1);
$('mSel').onchange=e=>{vm=+e.target.value;render()};

/* tabs */
function tab(k){
  $('pK').hidden=!k;$('pQ').hidden=k;
  $('tK').setAttribute('aria-pressed',k);$('tQ').setAttribute('aria-pressed',!k);
  if(!k&&!cur)newQ();
}
$('tK').onclick=()=>tab(true);$('tQ').onclick=()=>tab(false);

/* quiz */
let cur=null,score=0,total=0;
const rnd=n=>Math.floor(Math.random()*n);
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
function opts(ans,pool){const o=[ans];for(const x of shuf(pool.filter(v=>v!==ans))){if(o.length>=4)break;o.push(x)}return shuf(o)}
function newQ(){
  const t=rnd(7);let q,a,p;
  const n=dim(vy,vm),d=1+rnd(n);
  if(t==0){q='Hari apa tanggal '+d+' '+M[vm]+' '+vy+'?';a=D[dow(vy,vm,d)];p=D}
  else if(t==1){q='Ada berapa hari di bulan '+M[vm]+' '+vy+'?';a=String(n);p=['28','29','30','31']}
  else if(t==2){const i=rnd(12);q='Bulan ke-'+(i+1)+' dalam setahun adalah bulan apa?';a=M[i];p=M}
  else if(t==3){const i=rnd(7);q='Setelah hari '+D[i]+' adalah hari apa?';a=D[(i+1)%7];p=D}
  else if(t==4){const i=rnd(12);q='Bulan apa yang datang setelah '+M[i]+'?';a=M[(i+1)%12];p=M}
  else if(t==5){q='Hari ini hari apa?';a=D[dow(T.y,T.m,T.d)];p=D}
  else{q='Hari ini tanggal berapa?';a=String(T.d);p=Array.from({length:28},(_,i)=>String(i+1))}
  cur={q,a};
  $('qt').textContent=q;$('fb').textContent='';$('nx').hidden=true;
  $('qo').innerHTML=opts(a,p).map(o=>'<button>'+o+'</button>').join('');
}
$('qo').onclick=e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const ok=b.textContent===cur.a;
  total++;if(ok)score++;
  [...$('qo').children].forEach(x=>{x.disabled=true;if(x.textContent===cur.a)x.classList.add('ok')});
  if(!ok)b.classList.add('no');
  $('fb').textContent=ok?pickMsg():'Hampir! Jawaban yang benar: '+cur.a;
  $('fb').style.color=ok?'var(--g)':'var(--r)';
  $('sc').textContent=score;$('tt').textContent=total;
  $('stars').textContent='⭐'.repeat(Math.min(score,10));
  $('nx').hidden=false;
  if(ok)say('Hebat');
};
const pickMsg=()=>['Hebat sekali!','Pintar! Benar!','Yeay, tepat sekali!','Kamu jago!'][rnd(4)];
$('nx').onclick=newQ;

fillToday();render();
</script>
</body>
</html>
